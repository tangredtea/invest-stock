name: Weekly security scan

on:
  schedule:
    # Sunday UTC = Monday Asia/Shanghai; staggered to avoid release contention.
    - cron: '7 21 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-weekly-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read-only source dependency scan
        shell: bash
        env:
          SECURITY_FLEET_MODE: weekly
        run: bash .github/security/weekly.sh
