name: Release source security gate

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-source-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: .security-fleet-source-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Read-only source dependency scan
        shell: bash
        working-directory: .security-fleet-source-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          SECURITY_FLEET_SOURCE_DIR: ${{ github.workspace }}/.security-fleet-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/security/weekly.sh
