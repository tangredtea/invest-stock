{{define "content"}}
<div class="min-h-full flex items-center justify-center p-4" x-data="LoginPage()" @keydown.enter="login()">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fas fa-chart-line text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">量化分析终端</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-1">A股量化投资分析系统</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div class="p-8">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-white text-center mb-6">欢迎回来</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">用户名</label>
                        <div class="relative">
                            <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" x-model="form.username"
                                   class="w-full pl-10 pr-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                   placeholder="请输入用户名" autofocus>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">密码</label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input :type="showPwd ? 'text' : 'password'" x-model="form.password"
                                   class="w-full pl-10 pr-12 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-shadow dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                   placeholder="请输入密码">
                            <button type="button" @click="showPwd=!showPwd"
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                <i class="fas" :class="showPwd?'fa-eye-slash':'fa-eye'"></i>
                            </button>
                        </div>
                    </div>
                    <button @click="login()" :disabled="loading"
                            class="w-full py-3 bg-primary hover:bg-primary-hover disabled:opacity-50 text-white rounded-lg font-medium flex items-center justify-center gap-2 transition-colors">
                        <span x-show="loading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                        <span x-show="!loading">登录</span>
                    </button>
                </div>
            </div>
            <div class="px-8 py-4 bg-gray-50 dark:bg-gray-700/50 border-t border-gray-200 dark:border-gray-700 text-center text-sm text-gray-500 dark:text-gray-400">
                还没有账号？<a href="/register" class="text-primary hover:underline">立即注册</a>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    if(localStorage.getItem('token')) location.href='/dashboard';
})();

function LoginPage() {
    return {
        loading: false,
        showPwd: false,
        form: { username: '', password: '' },
        async login() {
            if (!this.form.username || !this.form.password) {
                Toast.warning('请输入用户名和密码');
                return;
            }
            this.loading = true;
            try {
                const res = await API.post('/api/auth/login', this.form);
                localStorage.setItem('token', res.data.token);
                localStorage.setItem('user', JSON.stringify(res.data.user));
                Toast.success('登录成功');
                setTimeout(() => { location.href = '/dashboard'; }, 200);
            } catch(e) {
                Toast.error(e.message || '登录失败');
            } finally {
                this.loading = false;
            }
        }
    };
}
</script>
{{end}}
