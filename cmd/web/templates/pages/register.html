{{define "content"}}
<div class="min-h-full flex items-center justify-center p-4" x-data="RegisterPage()" @keydown.enter="register()">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fas fa-chart-line text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">量化分析终端</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-1">创建新账户</p>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div class="p-8">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-white text-center mb-6">注册账户</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">用户名</label>
                        <div class="relative">
                            <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" x-model="form.username"
                                   class="w-full pl-10 pr-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                   placeholder="至少3个字符" autofocus>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">密码</label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="password" x-model="form.password"
                                   class="w-full pl-10 pr-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                   placeholder="至少6个字符">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">确认密码</label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="password" x-model="form.confirm"
                                   class="w-full pl-10 pr-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                   placeholder="再次输入密码">
                        </div>
                    </div>
                    <button @click="register()" :disabled="loading"
                            class="w-full py-3 bg-primary hover:bg-primary-hover disabled:opacity-50 text-white rounded-lg font-medium flex items-center justify-center gap-2 transition-colors">
                        <span x-show="loading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                        <span x-show="!loading">注册</span>
                    </button>
                </div>
            </div>
            <div class="px-8 py-4 bg-gray-50 dark:bg-gray-700/50 border-t border-gray-200 dark:border-gray-700 text-center text-sm text-gray-500">
                已有账号？<a href="/login" class="text-primary hover:underline">返回登录</a>
            </div>
        </div>
    </div>
</div>

<script>
function RegisterPage() {
    return {
        loading: false,
        form: { username: '', password: '', confirm: '' },
        async register() {
            if (this.form.username.length < 3) {
                Toast.warning('用户名至少3个字符'); return;
            }
            if (this.form.password.length < 6) {
                Toast.warning('密码至少6个字符'); return;
            }
            if (this.form.password !== this.form.confirm) {
                Toast.warning('两次密码不一致'); return;
            }
            this.loading = true;
            try {
                const res = await API.post('/api/auth/register', {
                    username: this.form.username,
                    password: this.form.password
                });
                localStorage.setItem('token', res.data.token);
                localStorage.setItem('user', JSON.stringify(res.data.user));
                Toast.success('注册成功');
                setTimeout(() => { location.href = '/dashboard'; }, 200);
            } catch(e) {
                Toast.error(e.message || '注册失败');
            } finally {
                this.loading = false;
            }
        }
    };
}
</script>
{{end}}
