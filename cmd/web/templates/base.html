{{define "base"}}
<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} - {{end}}量化分析终端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config={
            darkMode:'class',
            theme:{extend:{colors:{primary:{DEFAULT:'#2563eb',hover:'#1d4ed8'}}}}
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        :root{--primary:#2563eb;--bg-body:#f9fafb}
        [x-cloak]{display:none!important}
    </style>
    <script>
        (function(){
            const t=localStorage.getItem('theme');
            if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100">
    {{template "content" .}}
    <div id="toast-container" role="status" aria-live="polite"></div>
    <script src="/static/js/common.js"></script>
</body>
</html>
{{end}}
